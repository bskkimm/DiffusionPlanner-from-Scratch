[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-planner-from-scratch"
version = "0.0.0"
description = "A compact, independently implemented Diffusion Planner study."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bskkimm" }]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "nbformat>=5.10", "jupyter>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = ["src"]
