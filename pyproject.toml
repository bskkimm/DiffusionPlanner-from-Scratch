[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-planner-from-scratch"
version = "0.0.0"
description = "A compact, independently implemented Diffusion Planner study."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bskkimm" }]
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
tracking = ["mlflow>=2.10"]
dev = ["pytest>=8.0", "ruff>=0.9", "nbformat>=5.10", "jupyter>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = ["src"]
