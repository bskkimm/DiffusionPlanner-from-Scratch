name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            lock: cpu-py311.lock
          - python: '3.12'
            lock: cpu-py312.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements/${{ matrix.lock }}
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m coverage run --branch --source=diffusion_planner -m pytest -q
        env:
          OMP_NUM_THREADS: '1'
      - run: python -m coverage report --show-missing
      - run: >-
          python -m coverage report --fail-under=80
          --include='*/diffusion_planner/model/*,*/diffusion_planner/augmentation.py,*/diffusion_planner/diffusion.py,*/diffusion_planner/guidance.py,*/diffusion_planner/sampling.py'
      - run: python -m diffusion_planner.train --help
      - run: python -m diffusion_planner.evaluate --help
      - run: python -m diffusion_planner.benchmark --help
      - run: python -m diffusion_planner.tuning --help
  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.21
      - run: ruff check src tests scripts notebooks/diffusion_planner_walkthrough.ipynb
      - run: ruff format --check src tests scripts notebooks/diffusion_planner_walkthrough.ipynb
  types:
    name: Static interface types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/cpu-py311.lock
      - run: >-
          python -m mypy --follow-imports=skip --ignore-missing-imports --check-untyped-defs
          src/diffusion_planner/config.py src/diffusion_planner/data.py
          src/diffusion_planner/augmentation.py src/diffusion_planner/training.py
  audit:
    name: Dependency advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/cpu-py311.lock
      - run: python scripts/audit_lock.py
  required:
    name: Required checks
    if: always()
    needs: [pytest, lint, types, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful jobs
        env:
          PYTEST: ${{ needs.pytest.result }}
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
          AUDIT: ${{ needs.audit.result }}
        run: >-
          test "$PYTEST" = success && test "$LINT" = success &&
          test "$TYPES" = success && test "$AUDIT" = success
