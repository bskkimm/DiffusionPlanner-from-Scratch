name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest==8.3.5
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '1'
      - run: python -m diffusion_planner.train --help
      - run: python -m diffusion_planner.evaluate --help
      - run: python -m diffusion_planner.benchmark --help
  lint:
    name: New modules lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.21
      - run: >-
          ruff check src/diffusion_planner/data.py src/diffusion_planner/train.py
          src/diffusion_planner/training.py src/diffusion_planner/tracking.py
          src/diffusion_planner/sampling.py src/diffusion_planner/metrics.py
          src/diffusion_planner/evaluate.py src/diffusion_planner/benchmark.py
          tests/test_data.py tests/test_diffusion.py tests/test_guidance.py tests/test_metrics.py
          tests/test_notebook.py tests/test_sampling.py tests/test_tracking.py tests/test_training.py
  required:
    name: Required checks
    if: always()
    needs: [pytest, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful jobs
        env:
          PYTEST: ${{ needs.pytest.result }}
          LINT: ${{ needs.lint.result }}
        run: test "$PYTEST" = success && test "$LINT" = success
